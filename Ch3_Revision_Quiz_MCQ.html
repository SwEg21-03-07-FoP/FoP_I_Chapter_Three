<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Chapter 3 Self-Check Quiz – Flow Control</title>
    <style>
        :root {
            --bg: #fafaf7;
            --fg: #1d2433;
            --mu: #5b6475;
            --ac: #1f5f8b;
            --card: #fff;
            --bd: #dfe3ea;
            --code: #eef2f7;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #13171f;
                --fg: #e8ebf1;
                --mu: #98a2b3;
                --ac: #6cb4e4;
                --card: #1b212c;
                --bd: #2c3442;
                --code: #232b38;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #13171f;
            --fg: #e8ebf1;
            --mu: #98a2b3;
            --ac: #6cb4e4;
            --card: #1b212c;
            --bd: #2c3442;
            --code: #232b38;
            color-scheme: dark
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 17px/1.65 Georgia, 'Times New Roman', serif
        }

        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 36px 20px 60px
        }

        h1 {
            font-size: clamp(26px, 5vw, 38px);
            line-height: 1.2;
            text-align: center;
            margin: .2em 0
        }

        .sub {
            text-align: center;
            color: var(--mu);
            margin-bottom: 28px
        }

        h2 {
            margin-top: 2em;
            padding-top: .4em;
            border-top: 2px solid var(--ac);
            font-size: 23px
        }

        h3 {
            font-size: 18px;
            margin-bottom: .2em
        }

        .card,
        .q {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 12px 18px;
            margin: 12px 0
        }

        .tag {
            font: 600 12px system-ui;
            border-radius: 10px;
            padding: 2px 10px;
            margin-left: 8px;
            vertical-align: middle;
            background: var(--code);
            color: var(--ac)
        }

        .easy {
            color: #2e9b57
        }

        .medium {
            color: #c98a00
        }

        .hard {
            color: #c0392b
        }

        pre {
            background: var(--code);
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font: 14px/1.5 ui-monospace, Menlo, monospace
        }

        code {
            background: var(--code);
            padding: 1px 5px;
            border-radius: 4px;
            font: .9em ui-monospace, Menlo, monospace
        }

        .mu {
            color: var(--mu);
            font-size: 15px
        }

        button {
            font: 14px system-ui;
            background: var(--ac);
            color: var(--bg);
            border: 0;
            border-radius: 16px;
            padding: 6px 16px;
            cursor: pointer;
            margin: 4px 6px 4px 0
        }

        button.on {
            outline: 2px solid var(--fg)
        }

        .o {
            display: block;
            width: 100%;
            text-align: left;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 8px;
            font: 15px system-ui;
            background: var(--code);
            color: var(--fg);
            border: 1px solid var(--bd)
        }

        .ok {
            border-color: #2e9b57 !important;
            background: rgba(46, 155, 87, .2) !important
        }

        .no {
            border-color: #c0392b !important;
            background: rgba(192, 57, 43, .2) !important
        }

        .why {
            font: 14px system-ui;
            color: var(--mu);
            margin-top: 6px
        }

        .q {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px
        }

        .q>div,
        .q>b {
            grid-column: 1/-1
        }

        .q .o {
            margin: 0;
            height: 100%
        }

        @media(max-width:560px) {
            .q {
                grid-template-columns: 1fr
            }
        }
    </style>
    <style>
        .btn {
            font: 14px system-ui;
            background: var(--ac);
            color: var(--bg);
            border: 0;
            border-radius: 16px;
            padding: 7px 18px;
            cursor: pointer;
            margin-top: 4px
        }

        .fbtn {
            font: 14px system-ui;
            background: var(--code);
            color: var(--fg);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 6px 16px;
            cursor: pointer
        }

        .fbtn.active {
            background: var(--ac);
            color: var(--bg);
            border-color: var(--ac)
        }

        .qcard {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 12px 0
        }

        .qhdr {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px
        }

        .qnum {
            font: 700 15px system-ui;
            color: var(--mu)
        }

        .qtext {
            font-size: 16px;
            margin-bottom: 10px;
            white-space: pre-wrap
        }

        .qopts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        @media(max-width:560px) {
            .qopts {
                grid-template-columns: 1fr
            }
        }

        .qopt {
            background: var(--code);
            color: var(--fg);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 8px 12px;
            font: 15px system-ui;
            text-align: left;
            cursor: pointer;
            white-space: pre-wrap
        }

        .qopt.ok {
            border-color: #2e9b57;
            background: rgba(46, 155, 87, .2)
        }

        .qopt.no {
            border-color: #c0392b;
            background: rgba(192, 57, 43, .2)
        }

        .qwhy {
            font: 14px system-ui;
            color: var(--mu);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--bd)
        }

        .qtag {
            font: 600 11px system-ui;
            border-radius: 10px;
            padding: 2px 9px;
            vertical-align: middle
        }

        .easy {
            background: rgba(46, 155, 87, .15);
            color: #2e9b57
        }

        .medium {
            background: rgba(201, 138, 0, .15);
            color: #c98a00
        }

        .hard {
            background: rgba(192, 57, 43, .15);
            color: #c0392b
        }

        .msg {
            font: 14px system-ui;
            color: var(--mu);
            text-align: center;
            min-height: 1.4em
        }
    </style>
</head>

<body>
    <main style="max-width:820px;margin:0 auto;padding:30px 20px 60px">
        <h1 style="font-size:xx-large; margin-bottom: -4%">
            Fundamentals of Programming I
        </h1>
        <h2 style="text-align:center; margin-bottom: -3%;">
            Chapter 3 - Program Flow Control
        </h2>
        <h2 style="text-align:center; font-size: medium; margin-bottom: -2%; border-spacing: 0px;">
          <p style ="margin-bottom: -1%; "></p>
          Revision Quiz: Multiple-Choice Questions
        </h2>

        <p style="color:var(--mu);text-align:center; margin-top: 3%;" >
            36 questions in Three Levels (Easy, Medium, and Hard)
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 20px; margin-bottom: -3%;"><button
                onclick="filter('all')" class="fbtn active" id="fall">All (36)</button><button onclick="filter('Easy')"
                class="fbtn" id="fEasy">Easy (12)</button><button onclick="filter('Medium')" class="fbtn"
                id="fMedium">Medium (12)</button><button onclick="filter('Hard')" class="fbtn" id="fHard">Hard
                (12)</button>
        </div>
        <p class="msg" id="score"></p>
        <div id="quiz"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn" id="rst">Start
                again</button><button class="btn" onclick="toggleKey()" id="keybtn">Show answer key</button></div>
        <div id="key" hidden></div>
    </main>
    <script>(function () {
            var Q = [["Easy", "Which of the following is NOT a basic flow-control structure in C++?", "Parallelism", "Sequence", "Selection", "Repetition", ""], ["Easy", "What does a diamond (◇) shape represent in a standard flowchart?", "A decision (true/false question)", "The start or end of the program", "A processing step", "Input or output", ""], ["Easy", "Which C++ statement executes a block of code only when a condition is true, with no otherwise action?", "if", "if-else", "switch", "while", ""], ["Easy", "In an if-else statement, how many branches run when the condition is true?", "Exactly one (the if branch)", "Both branches", "Neither branch", "It depends on the compiler", ""], ["Easy", "Which keyword in a switch statement stops execution from falling through into the next case?", "break", "return", "exit", "continue", ""], ["Easy", "A for loop always has three parts separated by semicolons. What is the correct order?", "Initialization ; Condition ; Update", "Condition ; Initialization ; Update", "Update ; Condition ; Initialization", "Initialization ; Update ; Condition", ""], ["Easy", "Which loop is guaranteed to run its body at least once, even if the condition is false from the start?", "do-while", "while", "for", "switch", ""], ["Easy", "What does continue do inside a loop?", "Skips the rest of the current pass and jumps to the next iteration", "Exits the loop immediately", "Ends the program", "Skips to the next switch case", ""], ["Easy", "What does break do inside a loop?", "Exits the loop immediately", "Skips the current iteration", "Ends the whole program", "Returns a value", ""], ["Easy", "Which of the following data types CANNOT be used as a switch expression in C++?", "double", "int", "char", "short", ""], ["Easy", "A while loop that never ends is called…", "An infinite loop", "A dead loop", "A null loop", "A recursive loop", ""], ["Easy", "What is the minimum number of times a while loop can execute its body?", "Zero", "One", "Two", "It depends on the update", ""], ["Medium", "What will the following code print?\nif (i == 0)\n  if (j == 0) cout << \"A\";\n  else cout << \"B\";  // when i=1, j=0", "Nothing is printed", "\"A\"", "\"B\"", "Compile error", "The else attaches to the nearest unmatched if — the inner one (j == 0). When i = 1 the outer condition is false, so neither inner branch runs."], ["Medium", "In a switch statement, what happens if a matched case has no break and the next case has code?", "Execution falls through and runs the next case's code too", "Only the matched case runs", "A compile error occurs", "The default case runs", "Without break, the switch uses fall-through: execution continues into the next case regardless of whether that case's value matches."], ["Medium", "What does this loop print?\nfor (int i = 1; i <= 5; i++) {\n  if (i == 3) continue;\n  cout << i;\n}", "1245", "12345", "1234", "245", "continue skips the rest of the body when i = 3, so 3 is never printed, but the loop carries on with 4 and 5."], ["Medium", "How many times does this loop run?\nint x = 10;\nwhile (x > 0) { x -= 3; }", "4", "3", "10", "Infinite", "x takes the values 10, 7, 4, 1, then x -= 3 makes it -2 which is not > 0, so the loop runs 4 times."], ["Medium", "What does this do-while print?\nint i = 1, sum = 0;\ndo { sum += i; i++; } while (i <= 0);\ncout << sum;", "1", "0", "Infinite loop", "Compile error", "do-while always runs the body at least once: sum becomes 1, i becomes 2, then 2 <= 0 is false, so the loop ends."], ["Medium", "An else-if ladder tests three conditions. The variable mark is 72. Which conditions are actually evaluated?\nif (mark >= 80) ...\nelse if (mark >= 60) ...\nelse if (mark >= 50) ...", "The first and second only", "All three", "Only the second", "Only the first", "72 >= 80 is false (first evaluated), then 72 >= 60 is true (second evaluated and runs). The third is never reached because the second matched."], ["Medium", "What is the output of this nested loop?\nfor (int i = 1; i <= 2; i++)\n  for (int j = 1; j <= 3; j++)\n    cout << i * j << \" \";", "1 2 3 2 4 6", "1 2 3 4 5 6", "2 4 6 2 4 6", "1 2 3 1 2 3", "Outer i = 1: prints 1 2 3. Outer i = 2: prints 2 4 6."], ["Medium", "Which construct is BEST for checking whether a number is 1, 2, 3, or 4 — each triggering a different exact action?", "switch", "for", "while", "if-else", "switch compares one expression against exact constant values. An else-if ladder works too, but switch is cleaner and more idiomatic for this pattern."], ["Medium", "A variable declared inside a for loop's initialization is in scope…", "Only inside that for loop", "For the rest of the function", "For the rest of the program", "Only in the loop's update expression", "A variable declared as part of for (int i = ...) has loop scope: it exists only while the loop runs and cannot be used outside it."], ["Medium", "What is wrong with this loop?\nint i = 0;\nwhile (i < 10) { cout << i; }", "i is never updated, so this is an infinite loop", "The condition uses < instead of <=", "i should start at 1", "cout should use endl", "Nothing inside the body changes i, so i < 10 is always true and the loop never ends."], ["Medium", "When is a do-while preferred over a while?", "When the body must execute at least once before the condition can be checked", "When the number of repeats is known in advance", "When you want the loop to possibly run zero times", "When you need a counter", "The classic example is input validation: you must ask the question at least once before you know whether the answer is acceptable."], ["Medium", "What does return 1; inside main tell the operating system?", "The program ended abnormally", "The program ended normally", "The loop iterated once", "A variable has value 1", "By convention, return 0 means success. Any non-zero value signals an error or abnormal termination to the OS or calling script."], ["Hard", "What is the output of this code?\nint a = 5, b = 3;\nif (a > b)\n  if (a > 10) cout << \"big\";\nelse cout << \"medium\";\ncout << \" done\";", "medium done", "big done", "done", "medium", "The else attaches to the inner if (a > 10). a > b is true so we enter the outer if; a > 10 is false so the else runs (medium); then done is always printed."], ["Hard", "How many times does this loop execute?\nfor (int i = 0, j = 10; i < j; i++, j--) {}", "5", "10", "4", "Infinite", "i starts at 0, j at 10. Each pass: i increases by 1, j decreases by 1. They meet at 5 (i = 5, j = 5), where i < j is false. The loop runs for i = 0,1,2,3,4 — exactly 5 times."], ["Hard", "What is printed?\nfor (int i = 1; i <= 5; i++) {\n  if (i == 3) break;\n  cout << i;\n}", "12", "123", "1234", "12345", "When i = 3, break exits the loop immediately — 3 and everything after are never printed."], ["Hard", "What does this switch fragment print when x = 2?\nswitch (x) {\n  case 1: cout << \"a\";\n  case 2: cout << \"b\";\n  case 3: cout << \"c\"; break;\n  default: cout << \"d\";\n}", "bc", "b", "bcd", "bd", "Case 2 matches and prints b. There is no break, so execution falls through into case 3, printing c. The break in case 3 stops it there. d is never printed."], ["Hard", "Which of these else-if ladders gives the WRONG grade for mark = 55?", "if (mark >= 60) grade = 'C'; else if (mark >= 50) grade = 'D'; else grade = 'F'; — this gives D, but the correct grade for 55 should be C", "if (mark >= 90) grade = 'A'; else if (mark >= 60) grade = 'C'; else grade = 'D';", "if (mark >= 90) grade = 'A'; else if (mark >= 55) grade = 'C'; else grade = 'D';", "if (mark >= 80) grade = 'B'; else if (mark >= 55) grade = 'C'; else grade = 'D';", "The first option tests >= 60 first. Since 55 is NOT >= 60, it falls to the else-if (>= 50) and assigns D. If the intended grade for 55 is C (e.g. C starts at 50), the boundary between C and D should be at 55, not 60. The order of tests determines the outcome."], ["Hard", "A function checkAge has return type int. What is WRONG with this code?\nvoid checkAge() {\n  if (age >= 18) return 1;\n  else return 0;\n}", "The function is declared void but returns values", "The conditions are wrong", "return must always be in main", "You need a break before return", "A void function must not return a value. The return type should be int, or the return statements should be removed and the result printed instead."], ["Hard", "What is the output?\nint x = 5;\nswitch (x % 2) {\n  case 0: cout << \"even\"; break;\n  case 1: cout << \"odd\";\n  default: cout << \"!\"; \n}", "odd!", "odd", "even", "!", "5 % 2 = 1, so case 1 matches and prints odd. There is no break, so execution falls through into default, printing !. Result: odd!"], ["Hard", "Which loop correctly counts backwards from 10 to 1?", "for (int i = 10; i >= 1; i--)", "for (int i = 10; i > 0; i++)", "for (int i = 1; i <= 10; i--)", "for (int i = 10; i > 1; i--)", "The condition must be i >= 1 (not i > 1, which stops at 2) and the update must be i-- (not i++, which would go up forever or never reach 0)."], ["Hard", "What is the value of sum after this code runs?\nint sum = 0;\nfor (int i = 1; i <= 5; i++) {\n  if (i % 2 == 0) continue;\n  sum += i;\n}", "9", "15", "6", "25", "continue skips even numbers. Only 1, 3, and 5 are added: 1 + 3 + 5 = 9."], ["Hard", "A student writes: if (score = 90) cout << \"A\"; — what is the actual effect?", "score is set to 90 and the condition is always true, so A is always printed", "Compile error: = is not allowed in conditions", "The condition checks whether score equals 90", "Nothing is printed", "= is assignment, not comparison. score = 90 assigns 90 (which is non-zero, so true) and the if body always runs. The correct comparison is ==."], ["Hard", "Which statement about break in nested loops is correct?", "break exits only the innermost loop that contains it", "break exits all loops at once", "break exits the outermost loop", "break is not allowed in nested loops", "break only breaks out of the nearest enclosing loop or switch. To exit an outer loop, you need a flag variable or (rarely) goto."], ["Hard", "What is the output of this code?\nint i = 1;\nwhile (i <= 3) {\n  cout << i;\n  if (i == 2) break;\n  i++;\n}\ncout << i;", "122", "123", "12", "1232", "i = 1: prints 1, condition i == 2 is false, i becomes 2. i = 2: prints 2, condition i == 2 is true, break exits. After the loop, i is still 2 — prints 2. Total: 122."]];
            var OPTS = ['if', 'if-else', 'else-if ladder', 'switch', 'for loop', 'while loop', 'do-while loop', 'break', 'continue', 'return'], cur = 'all', answered = {}, correct = {}, showing = {};
            function sh(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t } return a }
            var quiz = document.getElementById('quiz'), sc = document.getElementById('score');
            function upd() {
                var tot = 0, r = 0; for (var k in answered) { tot++; if (correct[k]) r++ }
                sc.textContent = tot ? 'Score: ' + r + ' / ' + tot + ' answered' : ''
            }
            function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
            function filter(lvl) {
                cur = lvl; document.querySelectorAll('.fbtn').forEach(function (b) { b.classList.remove('active') });
                document.getElementById('f' + lvl).classList.add('active');
                document.querySelectorAll('.qcard').forEach(function (d) { d.style.display = (lvl === 'all' || d.dataset.lvl === lvl) ? '' : 'none' })
            }
            function build() {
                quiz.innerHTML = ''; answered = {}; correct = {}; upd();
                Q.forEach(function (q, i) {
                    var lvl = q[0], qtext = q[1], ans = q[2], expl = q[6];
                    var opts = sh([ans, q[3], q[4], q[5]]);
                    var d = document.createElement('div'); d.className = 'qcard'; d.dataset.lvl = lvl;
                    var lvlcls = lvl === 'Easy' ? 'easy' : lvl === 'Medium' ? 'medium' : 'hard';
                    d.innerHTML = '<div class="qhdr"><span class="qnum">' + (i + 1) + '.</span><span class="qtag ' + lvlcls + '">' + lvl + '</span></div><div class="qtext">' + esc(qtext).replace(/\n/g, '<br>') + '</div><div class="qopts"></div><div class="qwhy" hidden></div>';
                    var optDiv = d.querySelector('.qopts'), why = d.querySelector('.qwhy');
                    var done = false, bs = {};
                    opts.forEach(function (o) {
                        var b = document.createElement('button'); b.className = 'qopt'; b.innerHTML = esc(o).replace(/\n/g, '<br>'); bs[o] = b;
                        b.onclick = function () {
                            if (done) return; done = true; answered[i] = true; correct[i] = (o === ans);
                            if (o === ans) { b.classList.add('ok') } else { b.classList.add('no'); bs[ans].classList.add('ok') }
                            if (expl) { why.innerHTML = '<b>' + (o === ans ? 'Correct.' : 'Not quite.') + '</b> ' + esc(expl); why.hidden = false }
                            upd()
                        }; optDiv.appendChild(b)
                    });
                    quiz.appendChild(d)
                }); filter(cur)
            }
            document.getElementById('rst').onclick = function () { document.getElementById('key').hidden = true; document.getElementById('keybtn').textContent = 'Show answer key'; build() };
            function toggleKey() {
                var k = document.getElementById('key'), b = document.getElementById('keybtn');
                if (!k.hidden) { k.hidden = true; b.textContent = 'Show answer key'; return }
                var html = '<h3 style="margin-top:20px">Answer key</h3><ol>';
                Q.forEach(function (q) { html += '<li><span class="qtag ' + (q[0] === 'Easy' ? 'easy' : q[0] === 'Medium' ? 'medium' : 'hard') + '">' + q[0] + '</span> <code>' + esc(q[2]) + '</code></li>' });
                k.innerHTML = html + '</ol>'; k.hidden = false; b.textContent = 'Hide answer key'
            }
            build()
        })();</script>
</body>

</html>
